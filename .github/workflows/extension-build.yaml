name: AndroidX Media3 FFmpeg Decoder / Build

# 仅 semver 标签（如 1.8.1）push 时跑完整构建并发包；main/master 分支 push 不触发。
on:
  pull_request:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read
  packages: write

env:
  NDK_VER: 26.1.10909125
  CMAKE_VER: 3.31.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Cache NDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VER }}
          key: ${{ runner.os }}-${{ env.NDK_VER }}

      - name: Install correct NDK and CMake
        run: sudo ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;${NDK_VER}" "cmake;${CMAKE_VER}"

      - name: Build ffmpeg (h264/hevc/vp9/av1/opus + Jellyfin audio set)
        run: bash ./build.sh

      - name: Build extension (Maven local layout for CI artifact)
        shell: bash
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal -Pjellyfin.version="$VER"
          else
            ./gradlew :media3-ffmpeg-decoder:publishToMavenLocal
          fi

      - name: Publish to GitHub Packages (semver tag only)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/}"
          ./gradlew :media3-ffmpeg-decoder:publishDefaultPublicationToGitHubPackagesRepository --no-daemon -Pjellyfin.version="$VER"

      - name: Upload Maven-local layout (org/jellyfin/media3)
        uses: actions/upload-artifact@v4
        with:
          name: maven-org-jellyfin-media3
          path: ~/.m2/repository/org/jellyfin/media3/
